<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Traffic manager</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}

.iso{--tm-asphalt:#171717;--tm-paint:#2e2e2e;--tm-stripe:#3a3a3a;--tm-stop:var(--anatomy-red);--tm-go:var(--anatomy-green)}
.iso[data-theme="light"]{--tm-asphalt:#ececea;--tm-paint:#ffffff;--tm-stripe:#c4c4c7}
.tm-road>.iso-top,.tm-lot>.iso-top{fill:var(--tm-asphalt)}
.tm-paint>.iso-fill{fill:var(--tm-paint)}
.tm-stripe>.iso-top,.tm-stripe>.iso-shade{fill:var(--tm-stripe)}
.tm-lamp{fill:var(--tm-stop);stroke:var(--anatomy-lo);stroke-width:.4}
.tm-lamp[data-go]{fill:var(--tm-go)}
.tm-glow{fill:var(--tm-stop);stroke:none;opacity:.28;filter:blur(1.6px)}
.tm-glow[data-go]{fill:var(--tm-go)}
.tm-strike,.tm-pip{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:.4;transition:fill .25s}
.tm-strike[data-on],.tm-pip[data-on]{fill:var(--tm-stop)}
.tm-pip[data-jam]{animation:tm-jam 1s ease-in-out infinite}
@keyframes tm-jam{50%{fill:var(--anatomy-paper)}}
.tm-arrow>.iso-fill,.tm-arrow>.iso-shade{fill:var(--tm-stop)}
.tm-arrow>.iso-shade[data-shade="2"],.tm-arrow>.iso-shade[data-shade="3"]{fill:color-mix(in srgb,var(--tm-stop) 78%,#000)}
.tm-arrow>.iso-top{fill:color-mix(in srgb,var(--tm-stop) 72%,#fff)}
.tm-arrow>.iso-line{stroke:color-mix(in srgb,var(--tm-stop) 55%,var(--anatomy-hi))}
.tm-crash{fill:none;stroke:var(--tm-stop);stroke-width:1.2}
.tm-stage{position:relative;overflow:hidden;--tm-fade:linear-gradient(#0000,#000 22px,#000 calc(100% - 22px),#0000),linear-gradient(90deg,#0000,#000 22px,#000 calc(100% - 22px),#0000);-webkit-mask-image:var(--tm-fade);-webkit-mask-composite:source-in;mask-image:var(--tm-fade);mask-composite:intersect}
.tm-back{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none}
.tm-front{position:relative}
.tm-shadows{filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.tm-shadows>path{fill:var(--anatomy-halo)}
.tm-stage{outline:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.tm-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.tm-stage[data-input="pointer"]:focus-visible{outline:none}
.tm-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.iso{background:var(--anatomy-card)}
.iso-plate{overflow:hidden;box-shadow:none;padding-bottom:92px}
.iso-plate-corners{z-index:2}
.iso-plate-corner[data-corner="title"]{left:50%;right:auto;transform:translateX(-50%)}
.iso-plate-corner[data-corner="strikes"]{top:0;right:0;text-transform:uppercase;letter-spacing:.3em;margin-right:-.3em}
.iso-plate-corner[data-corner="readout"]{left:0;right:0;text-align:center;white-space:normal;line-height:1.4}
.tm-alert{position:absolute;z-index:2;left:20px;right:20px;bottom:46px;padding:7px 10px;text-align:center;font-family:var(--anatomy-mono);font-size:10.5px;line-height:1.4;letter-spacing:.06em;text-transform:uppercase;color:var(--tm-stop);border:1px solid color-mix(in srgb,var(--tm-stop) 55%,transparent);background:color-mix(in srgb,var(--tm-stop) 9%,var(--anatomy-card));animation:tm-blink 1s steps(1,end) infinite}
.tm-alert[hidden]{display:none}
@keyframes tm-blink{50%{opacity:.3}}
.tm-guide{margin-top:16px;border-top:1px solid var(--anatomy-faint);color:var(--anatomy-muted);font-size:13px;line-height:1.5}
.tm-guide>summary{display:flex;align-items:center;gap:10px;padding:14px 0;list-style:none;cursor:pointer;color:var(--anatomy-text);font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tm-guide>summary::-webkit-details-marker{display:none}
.tm-guide>summary::before{content:"";width:5px;height:5px;margin:0 2px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.tm-guide[open]>summary::before{transform:rotate(45deg)}
.tm-guide>summary:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:4px}
.tm-rules{display:grid;gap:10px;margin:0;padding:0 0 16px;list-style:none}
.tm-rules li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.tm-icon{display:block;width:16px;height:16px;margin-top:2px}
.tm-icon *{fill:none;stroke:var(--anatomy-hi);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.tm-icon .tm-icon-dash{stroke:var(--anatomy-mid)}
.tm-icon .tm-icon-go{fill:var(--tm-go);stroke:var(--anatomy-lo)}
.tm-icon .tm-icon-stop{fill:var(--tm-stop);stroke:var(--anatomy-lo)}
.tm-icon .tm-icon-red{stroke:var(--tm-stop)}
.tm-icon .tm-icon-arrow{fill:var(--tm-stop);stroke:color-mix(in srgb,var(--tm-stop) 55%,var(--anatomy-hi))}
.tm-icon-x{margin-top:0;color:var(--anatomy-text);font-family:var(--anatomy-mono);font-size:11px;line-height:18px;letter-spacing:.1em;text-align:center}
@media (max-width:560px){.iso-plate{padding-bottom:96px}.iso-plate .tm-stage{width:116%;margin:0 -8%}.tm-alert{left:12px;right:12px;bottom:44px}}
@media (prefers-reduced-motion:reduce){.tm-strike,.tm-pip{transition:none}.tm-pip[data-jam],.tm-alert{animation:none}.tm-guide>summary::before{transition:none}}

rikes end the shift: each crash, and each countdown that runs out.</span></li><li><svg class="tm-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 14.5V6.8a1.4 1.4 0 0 1 2.8 0v4.2"/><path d="M8.3 9.3a1.3 1.3 0 0 1 2.6 0v1.5a1.3 1.3 0 0 1 2.6 0v.8c0 1.6-1 2.9-2.4 2.9"/><path d="M3.5 4.5a4.2 4.2 0 0 1 6.8 0"/></svg><span>Swipe to move, pinch to zoom, double-tap to see the whole board.</span></li><li><svg class="tm-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4.5" width="13" height="7" rx="1.2"/><path d="M4 9h8"/></svg><span>Space starts a shift or shuts every gate. P pauses.</span></li></ul></details></figure></main><script type="module">const k = (() => {
const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";

  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;

    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }

      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };

  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;

      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());

      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

      let score = -Infinity;

      if (best && score > -0.05) {

        quad(arc, { from: centre, to: centre });

    for (const entry of above) {
      if (entry.used) continue;

    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);

      const countOf = (level) => (level.groups.get(tone) ?? []).length;

      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);

    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {

    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);

        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;

    let sweep = wrap(to - from);

    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));

  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);

  const m = meridian.length;

    midS.push(Math.sin(t));

  const tones = [];

  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;

      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;

  const compare = (a, b) => {
    for (let axis = 0; axis < 6; axis += 2) {
      if (a[axis + 1] <= b[axis] + eps) return -1;
      if (b[axis + 1] <= a[axis] + eps) return 1;

    for (let j = i + 1; j < items.length; j++) {
      const a = boxes[i];
      const b = boxes[j];
      if (a[1] <= b[0] || b[1] <= a[0] || a[3] <= b[2] || b[3] <= a[2]) continue;

  const visit = (index) => {
    if (seen[index]) return;

    for (const other of behind[index]) visit(other);
    out.push(items[index]);
  };

    .map((item, index) => [centre(item.box), index])
    .sort((a, b) => a[0] - b[0])
    .forEach(([, index]) => visit(index));

}

// eases back in.
function resetBoard() {
  for (const [key, entry] of items) {
    if (!entry.tile) continue;
    entry.el.remove();
    items.delete(key);
  }
  for (const [index, board] of boards) {
    if (!index) continue;
    board.el.remove();
    board.halo.remove();
    board.pips.remove();
    boards.delete(index);
  }
  arriving.length = 0;
  order = [];
  drawTile(game.tiles[0]);
  aimAt(SCENE.viewFor(game.tiles));
}

function syncVehicles() {
  const alive = new Set();
  for (const vehicle of game.vehicles) {
    alive.add(vehicle.id);
    const body = M.bodyOf(vehicle);
    const x = body.x * U;
    const y = body.y * U;
    let entry = drawn.get(vehicle.id);
    if (!entry) {
      const el = node("g", { class: "tm-vehicle" });
      const shadow = node("path");
      entry = { el, shadow, key: `v${vehicle.id}`, th: null, x: null, y: null, wreck: false, alpha: 1 };
      drawn.set(vehicle.id, entry);
      items.set(entry.key, entry);
      sortedLayer.appendChild(el);
      shadowLayer.appendChild(shadow);
    }
    if (vehicle.wreck) {
      if (!entry.wreck || entry.th !== body.th || entry.x !== x || entry.y !== y) {
        entry.el.innerHTML = PARTS.vehicleSvg(vehicle.kind, x, y, body.th, P, { tone: "mid", halo: false });
        entry.shadow.setAttribute("d", PARTS.vehicleHaloOf(vehicle.kind, x, y, body.th, P));
        for (const el of [entry.el, entry.shadow]) el.removeAttribute("transform");
        entry.el.classList.add("tm-wreck");
      }
    } else {
      if (entry.th === null) {
        entry.el.innerHTML = PARTS.vehicleSvg(vehicle.kind, 0, 0, body.th, P, { halo: false });
        entry.shadow.setAttribute("d", PARTS.vehicleHaloOf(vehicle.kind, 0, 0, body.th, P));
      }
      const move = k.translateAlong(P, [x, y, 0]);
      for (const el of [entry.el, entry.shadow]) el.setAttribute("transform", move);
    }
    if (entry.x !== x || entry.y !== y || entry.th !== body.th) entry.screen = null;
    Object.assign(entry, { th: body.th, x, y, wreck: vehicle.wreck, box: PARTS.vehicleBox(vehicle.kind, x, y, body.th) });
    const alpha = Math.round(M.alphaOf(game, vehicle) * 100) / 100;
    if (alpha !== entry.alpha) {
      for (const el of [entry.el, entry.shadow]) {
        if (alpha >= 1) el.removeAttribute("opacity");
        else el.setAttribute("opacity", String(alpha));
      }
      entry.alpha = alpha;
    }
  }
  for (const [id, entry] of drawn) {
    if (alive.has(id)) continue;
    entry.el.remove();
    entry.shadow.remove();
    items.delete(entry.key);
    drawn.delete(id);
  }
}

const isSelected = (index, id) => selected?.tile === index && selected.id === id;

function syncGates() {
  for (const tile of game.tiles) {
    for (const id of M.IDS) {
      const entry = items.get(`gate-${tile.index}-${id}`);
      if (!entry) continue;
      const share = tile.arm[id];
      const lit = isSelected(tile.index, id);
      const sign = `${share.toFixed(4)}|${tile.open[id]}|${lit}`;
      if (entry.sign === sign) continue;
      entry.el.innerHTML = PARTS.gateSvg(id, share, P, { go: tile.open[id], lit });
      entry.box = SCENE.shiftBox(PARTS.gateBox(id, share), SCENE.offsetOf(tile));
      entry.screen = null;
      entry.sign = sign;
    }
  }
  const board = items.get("strikes");
  const strikes = mode === "demo" ? 0 : Math.min(M.STRIKES, game.strikes);
  if (board.sign !== strikes) {
    board.el.innerHTML = PARTS.strikeBoardSvg(strikes, P);
    board.sign = strikes;
  }
  for (const pip of pips) {
    const lane = pip.dataset.lane;
    const backlog = game.backlog[lane];
    if (!backlog) continue;
    const on = backlog.length > Number(pip.dataset.n);
    const jam = mode === "play" && Boolean(game.jam[lane]);
    if (on !== pip.hasAttribute("data-on")) pip.toggleAttribute("data-on", on);
    if (jam !== pip.hasAttribute("data-jam")) pip.toggleAttribute("data-jam", jam);
  }
}

function sortLayer() {
  const list = [...items.values()];
  for (const item of list) item.screen ??= SCENE.screenBoxOf(item.box, P);
  const next = SCENE.paintOrder(list, P);
  if (next.length === order.length && next.every((item, index) => item === order[index])) return;
  // Move only what is out of place: every move repaints what it covers.
  let cursor = sortedLayer.firstChild;
  for (const item of next) {
    if (item.el === cursor) cursor = cursor.nextSibling;
    else sortedLayer.insertBefore(item.el, cursor);
  }
  order = next;
}

// The camera. The front drawing takes the view as its viewBox. The back one
// keeps the box it was last painted at and is carried to the view by a
// compositor transform, so moving the camera doesn't repaint the ground; it
// is repainted once the camera rests, so it ends sharp. Line weights hold
// because the kit's strokes don't scale.
const boxText = (box) => box.map((value) => Math.round(value * 100) / 100).join(" ");
const same = (a, b) => a.every((value, index) => value === b[index]);
function showView() {
  svg.setAttribute("viewBox", boxText(view));
  back.style.transform = same(view, painted) ? "" : `translate(${(((painted[0] - view[0]) / view[2]) * 100).toFixed(3)}%, ${(((painted[1] - view[1]) / view[3]) * 100).toFixed(3)}%) scale(${(painted[2] / view[2]).toFixed(5)})`;
}
function paint(box) {
  painted = [...box];
  back.setAttribute("viewBox", boxText(painted));
  showView();
}

// Eases to a box, exponentially, so a new tile pulls the view back calmly.
// The back drawing is painted at the destination first.
function aimAt(box) {
  aim = box;
  paint(box);
}
function moveCamera(dt) {
  if (gesture.points.size) return;
  if (same(view, aim)) {
    if (!same(view, painted)) paint(view);
    return;
  }
  const share = still.matches ? 1 : 1 - Math.exp(-dt / CAMERA);
  view = view.map((value, index) => {
    const next = value + (aim[index] - value) * share;
    return Math.abs(aim[index] - next) < 0.25 ? aim[index] : next;
  });
  showView();
}

// Touch: one finger swipes the board and two pinch it, about the point
// between them; a touch that barely moves is a tap. The view can't drift off
// the board or zoom past a fifth of the card.
const gesture = { points: new Map(), anchor: null, tap: null, lastTap: null };
const SLOP = 10;
function clampView([x, y, w]) {
  const fit = SCENE.viewFor(game.tiles);
  const width = Math.min(Math.max(w, SCENE.WIDTH / 5), fit[2] * 1.25);
  const height = (width * SCENE.HEIGHT) / SCENE.WIDTH;
  const cx = Math.min(Math.max(x + w / 2, fit[0]), fit[0] + fit[2]);
  const cy = Math.min(Math.max(y + (w * SCENE.HEIGHT) / SCENE.WIDTH / 2, fit[1]), fit[1] + fit[3]);
  return [cx - width / 2, cy - height / 2, width, height];
}
function spreadOf() {
  const list = [...gesture.points.values()];
  const mid = [list.reduce((sum, [x]) => sum + x, 0) / list.length, list.reduce((sum, [, y]) => sum + y, 0) / list.length];
  const spread = list.length > 1 ? Math.hypot(list[0][0] - list[1][0], list[0][1] - list[1][1]) : 0;
  return { mid, spread };
}
function anchor() {
  const rect = svg.getBoundingClientRect();
  const { mid, spread } = spreadOf();
  const per = view[2] / rect.width;
  gesture.anchor = { rect, spread, width: view[2], world: [view[0] + (mid[0] - rect.left) * per, view[1] + (mid[1] - rect.top) * per] };
}
function follow() {
  const { rect, spread: from, width, world } = gesture.anchor;
  const { mid, spread } = spreadOf();
  const w = width * (from && spread ? from / spread : 1);
  const per = w / rect.width;
  view = clampView([world[0] - (mid[0] - rect.left) * per, world[1] - (mid[1] - rect.top) * per, w]);
  aim = [...view];
  showView();
}

// A tap acts like a click. Two quick taps off the roads frame the whole
// board again.
function tapAt(event) {
  const target = approachAt(event);
  const now = performance.now();
  const before = gesture.lastTap;
  gesture.lastTap = { x: event.clientX, y: event.clientY, t: now };
  if (!target && mode === "play" && before && now - before.t < 350 && Math.hypot(event.clientX - before.x, event.clientY - before.y) < 40) {
    gesture.lastTap = null;
    aimAt(SCENE.viewFor(game.tiles));
    run();
    return;
  }
  act(target);
}

// A new tile fades in as the camera pulls back. Opacity is written as an
// attribute because the painter's sort moves nodes, which restarts CSS
// animations.
function fadeIn(now) {
  for (let index = arriving.length - 1; index >= 0; index--) {
    const { el, since, land: settle } = arriving[index];
    const alpha = still.matches ? 1 : M.smooth(0, ARRIVE, (now - since) / 1000);
    if (alpha >= 1) {
      el.removeAttribute("opacity");
      arriving.splice(index, 1);
      settle?.();
    } else el.setAttribute("opacity", alpha.toFixed(3));
  }
}

const burst = (age, rise, fall) => (age < 0 ? 0 : M.smooth(0, rise, age) * (age > rise ? Math.exp(-(age - rise) / fall) : 1));

// While a road is jammed, a red arrow bobs over the gate holding its queue,
// just short of the stop line: the place to tap.
function arrows(now) {
  if (mode !== "play") return [];
  const bob = still.matches ? 0 : 2.5 * Math.sin((now / 1000) * Math.PI * 1.8);
  return M.jamsOf(game).map((lane) => {
    const gate = M.gateFor(game, lane.id);
    const [x, y] = M.tileLaneAt(game.tiles[gate.tile], M.BY_ID[gate.id], M.S_STOP - 3.5).map((value) => value * U);
    return `<g transform="${k.translateAlong(P, [x, y, PARTS.ARROW_LIFT + bob])}">${ARROW}</g>`;
  });
}

function drawFx(now) {
  const out = arrows(now);
  for (let index = fx.length - 1; index >= 0; index--) {
    const age = (now - fx[index].at) / 1000;
    if (age > 1.8) {
      fx.splice(index, 1);
      continue;
    }
    const { x, y, size } = fx[index];
    const grow = 1 - Math.exp(-age / 0.22);
    const alpha = burst(age, 0.06, 0.32);
    out.push(`<path class="tm-crash" opacity="${alpha.toFixed(3)}" d="${k.ring(x, y, 3 + size * grow, PARTS.ROAD_H + 0.2, P, 40)}"/>`);
    out.push(`<path class="tm-crash" opacity="${(alpha * 0.5).toFixed(3)}" d="${k.ring(x, y, 2 + size * 0.55 * grow, PARTS.ROAD_H + 0.2, P, 40)}"/>`);
  }
  const html = out.join("");
  if (fxLayer.innerHTML !== html) fxLayer.innerHTML = html;
}

// Roads are named by the side they come in from, and numbered from the north
// or the west once the board has more than one row or column.
function entryName(lane) {
  const lines = M.laneList(game).filter((each) => each.approach === lane.approach).length;
  return lines > 1 ? `${NAMES[lane.approach]} entry ${Number(lane.id.slice(1)) + 1}` : `${NAMES[lane.approach]} road`;
}
const gateName = ({ tile, id }) => (game.tiles.length > 1 ? `tile ${tile + 1} ${NAMES[id]}` : NAMES[id]);

function handleEvents(now) {
  while (game.events.length) {
    const event = game.events.shift();
    if (mode !== "play") continue;
    if (event.type === "crash") {
      if (!still.matches) fx.push({ x: event.x * U, y: event.y * U, size: 10 + Math.min(22, event.speed * 2.2), at: now });
      say(`Crash, strike ${game.strikes} of ${M.STRIKES}.`);
    }
    if (event.type === "jam") say(`The ${entryName(game.lanes[event.lane])} jammed, strike ${game.strikes} of ${M.STRIKES}.`);
    if (event.type === "tile") {
      for (const tile of game.tiles) drawTile(tile, tile.index === event.index ? now : null);
      aimAt(SCENE.viewFor(game.tiles));
      say(`Tile ${event.index + 1} joins the board with every gate shut.`);
    }
    if (event.type === "over") {
      mode = "over";
      if (game.cleared > best) {
        best = game.cleared;
        writeBest(best);
      }
      say(`${overText()}. Press Space for a new shift.`);
    }
  }
}

const overText = () => `${M.STRIKES} strikes · ${game.cleared} through`;

// What the card says: the score top left, a cross per strike top right, what
// comes next along the bottom, and the most urgent jam in the blinking bar.
function words() {
  const playing = mode !== "demo";
  const score = `Score: ${playing ? game.cleared : 0}`;
  const strikes = playing ? Array(Math.min(M.STRIKES, game.strikes)).fill("X").join(" ") : "";
  const [jam] = mode === "play" ? M.jamsOf(game) : [];
  const alert = jam ? `${entryName(jam)} jammed · tap under the arrow · ${Math.ceil(game.jam[jam.id].left)} s` : "";
  let bottom;
  if (mode === "demo") bottom = "Tap or press Space to start a shift";
  else if (mode === "over") bottom = `Shift over · best ${best} · tap to play again`;
  else if (paused) bottom = "Paused · P to resume";
  else if (selected && game.tiles[selected.tile]) bottom = `${gateName(selected)} gate ${game.tiles[selected.tile].open[selected.id] ? "open" : "shut"} · ${M.waitingAt(game, selected.tile, selected.id)} waiting`;
  else bottom = M.nextTileAt(game) === null ? "Board full" : `Next tile at ${M.nextTileAt(game)}`;
  return { score, strikes, bottom, alert };
}

const write = (el, text) => {
  if (el.textContent !== text) el.textContent = text;
};

// Says so once when a road starts counting down to a jam strike.
function warn() {
  const now = new Set(mode === "play" ? M.jamsOf(game).map((lane) => lane.id) : []);
  for (const id of now) if (!warned.has(id)) say(`The ${entryName(game.lanes[id])} is jammed. Open the gate under the arrow within ${M.JAM_TIME} seconds.`);
  warned = now;
}

function render(now, dt) {
  handleEvents(now);
  syncVehicles();
  syncGates();
  sortLayer();
  fadeIn(now);
  moveCamera(dt);
  drawFx(now);
  warn();
  const { score, strikes, bottom, alert } = words();
  write(scoreboard, score);
  write(strikeboard, strikes);
  write(readout, bottom);
  write(alarm, alert);
  if (alarm.hidden !== !alert) alarm.hidden = !alert;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const running = !paused && !(mode === "demo" && still.matches);
  if (running) {
    carry += dt;
    while (carry >= M.STEP) {
      M.step(game);
      carry -= M.STEP;
    }
  }
  render(now, dt);
  frame = visible && !document.hidden ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible && !document.hidden) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

function setSelected(target) {
  if (selected?.tile === target?.tile && selected?.id === target?.id) return;
  selected = target;
  run();
}

function pointerAt(event) {
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  return point.matrixTransform(svg.getScreenCTM().inverse());
}

// Only the roads take a tap: the arm of the road a pointer is over names the
// tile and the gate on it. The boxes in the middle, the gate cabinets standing
// over the asphalt and everything off it do nothing.
function approachAt(event) {
  if (document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".tm-cabinet")) return null;
  const { x: sx, y: sy } = pointerAt(event);
  const { sinA, cosA, sinE, k: scale } = k.cameraOf(P);
  const p = (sx - P.origin[0]) / scale;
  const q = (sy - P.origin[1]) / (sinE * scale);
  const wx = p * sinA + q * cosA;
  const wy = -p * cosA + q * sinA;
  const col = Math.round(wx / DATA.pitch);
  const row = Math.round(wy / DATA.pitch);
  const tile = game.tiles.find((each) => each.col === col && each.row === row);
  if (!tile) return null;
  const x = wx - col * DATA.pitch;
  const y = wy - row * DATA.pitch;
  const edge = DATA.board + 6;
  if (Math.abs(x) > edge || Math.abs(y) > edge) return null;
  const at = (id) => (id ? { tile: tile.index, id } : null);
  if (Math.abs(y) <= DATA.road) return at(x < -DATA.road ? "W" : x > DATA.road ? "E" : null);
  if (Math.abs(x) <= DATA.road) return at(y < -DATA.road ? "N" : y > DATA.road ? "S" : null);
  return null;
}

function act(target) {
  if (mode !== "play") start();
  if (target && game.tiles[target.tile]) M.toggle(game, target.tile, target.id);
  run();
}

stage.addEventListener("pointerdown", (event) => {
  stage.dataset.input = "pointer";
  stage.focus({ preventScroll: true });
  if (event.pointerType !== "touch") {
    act(approachAt(event));
    return;
  }
  try {
    stage.setPointerCapture(event.pointerId);
  } catch {}
  gesture.points.set(event.pointerId, [event.clientX, event.clientY]);
  gesture.tap = gesture.points.size === 1 ? [event.clientX, event.clientY] : null;
  anchor();
  run();
});
stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "mouse") setSelected(approachAt(event));
  if (!gesture.points.has(event.pointerId)) return;
  gesture.points.set(event.pointerId, [event.clientX, event.clientY]);
  if (gesture.tap && Math.hypot(event.clientX - gesture.tap[0], event.clientY - gesture.tap[1]) > SLOP) gesture.tap = null;
  if (!gesture.tap) follow();
});
const lift = (event) => {
  if (!gesture.points.has(event.pointerId)) return;
  gesture.points.delete(event.pointerId);
  const tapped = gesture.tap && event.type === "pointerup";
  gesture.tap = null;
  if (gesture.points.size) anchor();
  if (tapped) tapAt(event);
};
stage.addEventListener("pointerup", lift);
stage.addEventListener("pointercancel", lift);
stage.addEventListener("pointerleave", (event) => {
  if (event.pointerType === "mouse") setSelected(null);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Tab") delete stage.dataset.input;
});
stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    if (mode !== "play") act(null);
    else for (const tile of game.tiles) M.IDS.forEach((id) => M.setOpen(game, tile.index, id, false));
    run();
  }
  if ((event.key === "p" || event.key === "P") && mode === "play") {
    paused = !paused;
    say(paused ? "Paused." : "Resumed.");
    run();
  }
});
stage.addEventListener("focus", () => {
  if (!announcer.textContent) say(mode === "play" ? words()[0] : "Demo running. Press Space to start a shift.");
});
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);
document.addEventListener("visibilitychange", run);
still.addEventListener("change", run);

// For the console and for scripted checks: the live game and the model.
window.trafficManager = { model: M, game: () => game, start, run };

demo();
render(performance.now(), 0);
</script></body></html>
